<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adventurers Guild — Integrated Career Loop v0.1</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20231f;background:#eee9dc}*{box-sizing:border-box}body{margin:0}.app{max-width:920px;margin:auto;min-height:100vh;background:#f8f4e9}.top{position:sticky;top:0;z-index:5;background:#26352d;color:white;padding:12px 14px;box-shadow:0 2px 8px #0003}.top h1{font-size:18px;margin:0}.meta{display:flex;gap:14px;font-size:12px;opacity:.9;margin-top:5px}.nav{display:flex;overflow:auto;background:#ddd4c0;border-bottom:1px solid #c7bda8}.nav button{border:0;background:none;padding:11px 14px;white-space:nowrap}.nav button.on{background:#f8f4e9;font-weight:700;border-bottom:3px solid #72552d}.pane{display:none;padding:14px}.pane.on{display:block}.card{background:white;border:1px solid #d5cdbd;border-radius:12px;padding:13px;margin:0 0 12px;box-shadow:0 1px 3px #0001}.card h2,.card h3{margin:0 0 7px}.row{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:11px;padding:3px 7px;border-radius:20px;background:#ece7dc}.muted{color:#6e706b;font-size:12px}.stat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;margin-top:8px}.btn{border:0;border-radius:8px;padding:9px 11px;background:#385746;color:white;font-weight:650}.btn.alt{background:#7a694d}.btn.warn{background:#87463d}.btn:disabled{opacity:.4}.notice{padding:10px;border-left:4px solid #876d3d;background:#f3ead6;margin:8px 0;font-size:13px}.timeline{border-left:2px solid #c4b89f;margin-left:7px;padding-left:13px}.event{margin:0 0 12px}.event b{font-size:13px}.event div{font-size:12px;color:#555}.good{color:#315f40}.bad{color:#8a3932}.hero{font-size:14px;line-height:1.45}.empty{text-align:center;color:#777;padding:30px 10px}.choice{border:2px solid transparent}.choice.selected{border-color:#72552d}.bar{height:7px;background:#e5dfd2;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#627866}.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#706b61;margin:14px 0 7px}@media(min-width:700px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.pane{padding:20px}}
</style></head><body><div class="app"><header class="top"><h1>Adventurers’ Guild — Career Loop Prototype</h1><div class="meta"><span id="date"></span><span id="gold"></span><span id="active"></span></div></header><nav class="nav" id="nav"></nav><main id="main"></main></div>
<script>
const TABS=['Guild','Recruit','Adventures','Careers','Chronicle'];
const prospects=[
{id:'mara',name:'Mara Venn',age:19,ask:45,summary:'Caravan outrider with strong references and an uncertain ceiling.',known:['Awareness: promising','Mobility: promising','Melee: limited evidence'],truth:{awareness:14,mobility:13,melee:7,resilience:11,potential:'strong'}},
{id:'elian',name:'Elian Tor',age:22,ask:55,summary:'Apothecary assistant fascinated by old wards. Another guild has made contact.',known:['Intelligence: strong evidence','Focus: promising','Warding: uncertain'],truth:{awareness:10,mobility:9,melee:5,resilience:10,potential:'exceptional'}},
{id:'tessa',name:'Tessa Arlen',age:20,ask:38,summary:'Local hunter. Reliable references; little experience beyond the district.',known:['Awareness: adequate','Mobility: adequate','Melee: uncertain'],truth:{awareness:12,mobility:12,melee:6,resilience:13,potential:'ordinary'}},
{id:'corin',name:'Corin Vale',age:18,ask:42,summary:'A miller’s son with unusual composure who appears after the Guild suffers turnover.',known:['Resilience: promising','Strength: promising','Field skill: little evidence'],truth:{awareness:11,mobility:11,melee:5,resilience:15,potential:'strong'}}];
const adventures=[
{id:'survey',title:'Missing Survey Team',risk:'Moderate',need:'Tracking, awareness, endurance',desc:'A Crownfields survey party vanished beyond the old boundary stones.'},
{id:'bell',title:'The Bell Below Dunmere',risk:'High',need:'Focus, arcane reasoning, composure',desc:'A submerged bell is sounding beneath an abandoned chapel.'},
{id:'whitehorn',title:'The Whitehorn Problem',risk:'High',need:'Awareness, mobility, creature handling',desc:'Something is driving whitehorns down from the ridge into farms.'},
{id:'road',title:'Road of Glass',risk:'Severe',need:'Leadership, resilience, arcane awareness',desc:'Escort a scholar through a route warped by recurring arcane weather.'}];
let S={tab:'Guild',day:1,year:1,gold:180,roster:[mkVeteran()],available:['mara','elian','tessa'],selectedProspect:null,selectedAdv:null,selectedParty:[],history:[],completed:0,seed:9173};
function mkVeteran(){return {id:'orin',name:'Orin Hale',age:34,field:'active',guild:'member',skills:{Melee:15,Tracking:13,Leadership:12},apt:{Awareness:14,Mobility:13,Resilience:14},injuries:[],evidence:[],missions:31,years:14,mentor:true};}
function rng(){S.seed=(S.seed*1664525+1013904223)>>>0;return S.seed/4294967296}
function log(title,text,who=[]){S.history.unshift({day:S.day,year:S.year,title,text,who})}
function advance(days){S.day+=days;while(S.day>360){S.day-=360;S.year++;S.roster.forEach(c=>{c.age++;c.years++});}recover();careerChecks()}
function recover(){S.roster.forEach(c=>{c.injuries=c.injuries.filter(i=>{i.days-=7;if(i.days<=0){log('Recovery',`${c.name} returned to full availability after ${i.name}.`,[c.id]);return false}return true})})}
function careerChecks(){S.roster.forEach(c=>{if(c.field!=='active')return;if(c.years>=22 && rng()<.035){c.field='retired';c.guild='staff';log('Career transition',`${c.name} ended field service and remained with the Guild as a veteran trainer.`,[c.id])}else if(c.years>=16 && rng()<.018){c.field='retired';c.guild='departed';log('Retirement',`${c.name} retired from adventuring and left the Guild on good terms.`,[c.id])}});if(S.roster.filter(c=>c.field==='active').length<2&&!S.available.includes('corin')&&!S.roster.some(c=>c.id==='corin'))S.available.push('corin')}
function recruit(id){let p=prospects.find(x=>x.id===id);if(!p||S.gold<p.ask)return;S.gold-=p.ask;S.available=S.available.filter(x=>x!==id);let c={id:p.id,name:p.name,age:p.age,field:'active',guild:'member',skills:{Melee:p.truth.melee,Tracking:Math.max(4,p.truth.awareness-5),Leadership:4},apt:{Awareness:p.truth.awareness,Mobility:p.truth.mobility,Resilience:p.truth.resilience},potential:p.truth.potential,injuries:[],evidence:[],missions:0,years:0};S.roster.push(c);log('Recruited',`${p.name} joined for ${p.ask} gold. The Guild still does not know exactly what ${p.name} may become.`,[id]);S.tab='Guild';render()}
function evalProspect(id,type){let p=prospects.find(x=>x.id===id);let cost=type==='Demonstration'?5:3;advance(cost);let reveal=type==='Interview'?`Temperament appears steady; ${p.truth.resilience>=13?'handles pressure unusually well':'no exceptional pressure response observed'}.`:type==='References'?`References support Awareness around ${band(p.truth.awareness)} and describe ${p.truth.potential==='exceptional'?'unusually rapid learning':'a credible developmental path'}.`:`A practical exercise suggests ${band(p.truth.melee)} current combat training; movement looks ${band(p.truth.mobility)}.`;p.known.push(reveal);log('Prospect evaluation',`${type}: ${p.name} — ${reveal}`,[id]);render()}
function band(v){return v>=15?'exceptional':v>=13?'strong':v>=11?'adequate':'limited'}
function toggleParty(id){S.selectedParty=S.selectedParty.includes(id)?S.selectedParty.filter(x=>x!==id):[...S.selectedParty,id];render()}
function runAdventure(){let a=adventures.find(x=>x.id===S.selectedAdv), party=S.roster.filter(c=>S.selectedParty.includes(c.id)&&c.field==='active'&&!c.injuries.length);if(!a||!party.length)return;let duration=4+Math.floor(rng()*5);advance(duration);let avg=party.reduce((z,c)=>z+c.apt.Awareness+c.apt.Resilience+c.skills.Melee,0)/(party.length*3);let diff={Moderate:10,High:12,Severe:14}[a.risk];let roll=1+Math.floor(rng()*20),margin=roll+avg-diff;let outcome=margin>=5?'Success':margin>=0?'Success with cost':margin>=-5?'Setback':'Withdrawal';let casualty=null;
party.forEach(c=>{c.missions++;c.evidence.push({year:S.year,type:'skill_exercised',skill:'Melee',stretch:a.risk!=='Moderate'});if(margin<5)c.evidence.push({year:S.year,type:'adverse_experience'});if(margin>=5)c.evidence.push({year:S.year,type:'decisive_contribution'});develop(c)});
if(outcome!=='Success' && rng() < ({Moderate:.12,High:.28,Severe:.46}[a.risk])){let c=party[Math.floor(rng()*party.length)],r=rng();if(a.risk==='Severe'&&r<.08){c.field='dead';c.guild='dead';casualty=`${c.name} was killed during the expedition.`}else if(r<.20){c.field='incapacitated';c.guild='member';casualty=`${c.name} survived a career-ending injury.`}else{let days=30+Math.floor(rng()*90);c.injuries.push({name:r<.55?'serious leg injury':'deep wound',days});casualty=`${c.name} was injured and is expected to recover in about ${days} days.`}}
S.gold+= outcome==='Success'?45:outcome==='Success with cost'?32:10;S.completed++;log(`${a.title}: ${outcome}`,`Roll ${roll}; ${party.map(c=>c.name).join(', ')}. ${casualty||'The party returned without a lasting injury.'}`,party.map(c=>c.id));S.selectedParty=[];S.selectedAdv=null;if(S.roster.filter(c=>c.field==='active').length<2&&!S.available.includes('corin')&&!S.roster.some(c=>c.id==='corin'))S.available.push('corin');render()}
function develop(c){let recent=c.evidence.filter(e=>e.year>=S.year-2), uses=recent.filter(e=>e.type==='skill_exercised').length, stretch=recent.filter(e=>e.stretch).length;if(uses>=4&&stretch>=2&&c.skills.Melee<20){let resistance=c.skills.Melee>=18?8:c.skills.Melee>=15?6:4;if(uses>=resistance){let old=c.skills.Melee;c.skills.Melee++;c.evidence=[];log('Development',`${c.name}'s accumulated field experience consolidated: Melee ${old} → ${c.skills.Melee}.`,[c.id])}}}
function wait(){advance(30);log('A month passes','Training, recovery, prospect movement, and Guild life continue.');render()}
function render(){document.getElementById('date').textContent=`Year ${S.year}, Day ${S.day}`;document.getElementById('gold').textContent=`${S.gold}g`;document.getElementById('active').textContent=`${S.roster.filter(c=>c.field==='active').length} active`;document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t?'on':''}" onclick="S.tab='${t}';render()">${t}</button>`).join('');document.getElementById('main').innerHTML=TABS.map(t=>`<section class="pane ${S.tab===t?'on':''}">${view(t)}</section>`).join('')}
function view(t){if(t==='Guild')return guild();if(t==='Recruit')return recruitView();if(t==='Adventures')return advView();if(t==='Careers')return careers();return chronicle()}
function guild(){return `<div class="hero card"><b>Guild objective:</b> build careers, not disposable units. Field veterans, develop uncertain recruits, survive losses, and prepare the next generation.</div><div class="grid">${S.roster.map(charCard).join('')}</div><button class="btn alt" onclick="wait()">Advance 30 days</button>`}
function charCard(c){let status=c.field==='active'?(c.injuries.length?`Recovering — ${c.injuries[0].days}d`:'Field active'):c.field==='dead'?'Dead':c.field==='incapacitated'?'Field incapacitated':c.guild==='staff'?'Guild staff':'Retired';return `<article class="card"><h3>${c.name} <span class="pill">Age ${c.age}</span></h3><div class="muted">${status} · ${c.missions} expeditions · ${c.years} career years</div><div class="stat"><span>Melee</span><b>${c.skills.Melee}</b><span>Tracking</span><b>${c.skills.Tracking}</b><span>Leadership</span><b>${c.skills.Leadership}</b><span>Awareness</span><b>${c.apt.Awareness}</b><span>Mobility</span><b>${c.apt.Mobility}</b><span>Resilience</span><b>${c.apt.Resilience}</b></div></article>`}
function recruitView(){let avail=prospects.filter(p=>S.available.includes(p.id));return avail.length?avail.map(p=>`<article class="card"><h3>${p.name} <span class="pill">Age ${p.age}</span></h3><p>${p.summary}</p>${p.known.map(k=>`<div class="notice">${k}</div>`).join('')}<div class="row"><button class="btn alt" onclick="evalProspect('${p.id}','Interview')">Interview · 3d</button><button class="btn alt" onclick="evalProspect('${p.id}','References')">References · 3d</button><button class="btn alt" onclick="evalProspect('${p.id}','Demonstration')">Demonstration · 5d</button><button class="btn" onclick="recruit('${p.id}')">Recruit · ${p.ask}g</button></div></article>`).join(''):`<div class="empty">No current prospects. Career turnover will bring recruitment back to the foreground.</div>`}
function advView(){let active=S.roster.filter(c=>c.field==='active');return adventures.map(a=>`<article class="card choice ${S.selectedAdv===a.id?'selected':''}" onclick="S.selectedAdv='${a.id}';render()"><h3>${a.title} <span class="pill">${a.risk}</span></h3><p>${a.desc}</p><div class="muted">Likely demands: ${a.need}</div></article>`).join('')+`<div class="section-title">Choose party</div>${active.map(c=>`<button class="btn ${S.selectedParty.includes(c.id)?'':'alt'}" ${c.injuries.length?'disabled':''} onclick="event.stopPropagation();toggleParty('${c.id}')">${c.name}${c.injuries.length?' (recovering)':''}</button> `).join('')}<div style="margin-top:12px"><button class="btn" ${!S.selectedAdv||!S.selectedParty.length?'disabled':''} onclick="runAdventure()">Commit expedition</button></div>`}
function careers(){return S.roster.map(c=>`<article class="card"><h3>${c.name}</h3><div class="muted">${c.field} / ${c.guild}</div><p>${careerText(c)}</p><div class="section-title">Recent evidence</div>${c.evidence.slice(-6).map(e=>`<div class="notice">Year ${e.year}: ${e.type}${e.skill?' — '+e.skill:''}</div>`).join('')||'<div class="muted">No unresolved development evidence.</div>'}</article>`).join('')}
function careerText(c){if(c.field==='dead')return 'Career ended in death. Their expedition history remains part of the Guild chronicle.';if(c.field==='incapacitated')return 'Field career ended by injury. They remain part of the Guild unless a later transition changes that.';if(c.guild==='staff')return 'Field career complete; institutional career continues inside the Guild.';return c.years<3?'Early career: identity and ceiling remain uncertain.':c.years<10?'Established adventurer: a meaningful body of evidence is forming.':c.years<20?'Veteran: accumulated experience increasingly defines their specialty.':'Exceptional long career: survival itself is now part of their story.'}
function chronicle(){return S.history.length?`<div class="timeline">${S.history.map(e=>`<div class="event"><b>Y${e.year} D${e.day} — ${e.title}</b><div>${e.text}</div></div>`).join('')}</div>`:'<div class="empty">The Guild has not made history yet.</div>'}
render();
</script></body></html>
