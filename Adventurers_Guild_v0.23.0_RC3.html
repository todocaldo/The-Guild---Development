function specialtyFit(c,skill){if(!skill||c.skills[skill]<=0)return 0;let trained=Object.values(c.skills).filter(v=>v>0),avg=trained.reduce((a,b)=>a+b,0)/trained.length,rank=topSkills(c.skills,SKILLS.length).findIndex(x=>x[0]===skill)+1;return +((Math.max(0,c.skills[skill]-avg)*.35)+(rank<=3?.6:rank<=6?.25:0)).toFixed(2)}

function runRescue(id){let sit=S.strandedSituations.find(x=>x.id===id&&x.status==='active'),rescuers=S.roster.filter(c=>S.selectedParty.includes(c.id)&&c.field==='active'&&!c.injuries.length);if(!sit||!rescuers.length)return;let start={year:S.year,day:S.day},events=[],requirements=[{id:'reach',label:`Reach the stranded ${sit.title} party`,criticality:'primary',status:'incomplete',reason:''}],distance=Math.max(2,sit.distanceToSafetyDays),capacity=rescuers.reduce((n,c)=>n+supplyCarryCapacity(c),0),runtime={startGold:S.gold,fatigue:0,threat:0,delayDays:0,costs:[],supplyCapacity:capacity,suppliesRemaining:capacity,supplyDailyConsumed:0,supplyExtraLost:0,supplyGained:0,supplyLedger:[],reserveDays:7,distanceToSafetyDays:0,plannedReturnDays:distance,emergencyRationing:{active:false,sourceEventId:null,leadId:null},provisionShortage:0,actualSituation:null,travelLegs:[]};let remainingWindow=Math.max(0,sit.rescueWindowDays-sit.daysStranded),estimatedArrival=distance;recordDecision('commit_rescue',{strandedSituationId:id,partyIds:rescuers.map(c=>c.id),estimatedArrivalDays:estimatedArrival,rescueWindowRemainingDays:remainingWindow,timelyArrivalPossible:estimatedArrival<=remainingWindow});let out=travelExposure('Outbound',distance,rescuers,'High',events,runtime,1);if(!out.complete||sit.status!=='active'){requirements[0].status='failed';requirements[0].reason=sit.status==='lost'?'The stranded party was lost before rescuers arrived.':out.reason||'The rescue party could not reach the stranded group.';runtime.distanceToSafetyDays=Math.max(1,distance);let ret=resolveReturn({returnRequirement:'Return rescue party to safety',returnCriticality:'supporting',risk:'High'},rescuers,events,requirements,runtime,distance,true);let fake={id:`rescue-${id}`,title:`Rescue: ${sit.title}`,objective:`Reach and recover the stranded ${sit.title} party.`,risk:'High'};return finalize(fake,rescuers,start,events,requirements,'Failure',ret.status,`${requirements[0].reason} ${ret.reason}`,runtime)}requirements[0].status='complete';let strandedParty=sit.partyIds.map(pid=>S.roster.find(c=>c.id===pid)).filter(c=>c&&c.field!=='dead');let extraction=resolveStateChallenge('On-site','rescueExtraction',rescuers,'High',events,runtime),exReq={id:'extract',label:'Stabilize and evacuate the stranded party',criticality:'primary',status:extraction.complete?'complete':'failed',reason:extraction.reason||''};requirements.push(exReq);if(!extraction.complete){runtime.distanceToSafetyDays=distance;let ret=resolveReturn({returnRequirement:'Return rescue party to safety',returnCriticality:'supporting',risk:'High'},rescuers,events,requirements,runtime,distance,true);let fake={id:`rescue-${id}`,title:`Rescue: ${sit.title}`,objective:`Reach and recover the stranded ${sit.title} party.`,risk:'High'};return finalize(fake,rescuers,start,events,requirements,'Failure',ret.status,`The rescue party reached the stranded group but could not safely evacuate them. ${ret.reason}`,runtime)}runtime.suppliesRemaining=+(runtime.suppliesRemaining+sit.suppliesRemaining).toFixed(1);runtime.supplyCapacity=runtime.suppliesRemaining;runtime.distanceToSafetyDays=distance;let combined=[...rescuers,...strandedParty.filter(c=>!rescuers.includes(c))],ret=resolveReturn({returnRequirement:'Return both parties to safety',returnCriticality:'primary',risk:'High'},combined,events,requirements,runtime,distance,false),obj=ret.status.startsWith('Returned')?'Success':'Partial Success',fake={id:`rescue-${id}`,title:`Rescue: ${sit.title}`,objective:`Reach and recover the stranded ${sit.title} party.`,risk:'High'};if(ret.status.startsWith('Returned'))completeStrandedReturn(sit,'rescued');return finalize(fake,rescuers,start,events,requirements,obj,ret.status,ret.status.startsWith('Returned')?'The rescue expedition recovered the stranded party and returned to safety.':`The rescue reached the stranded party but could not complete the return. ${ret.reason}`,runtime)}
function develop(c,report){let grouped={};c.evidence.filter(e=>!e.developmentConsumedBy&&(e.type==='skill_exercised'||e.type==='causal_support')&&e.skill).forEach(e=>{if(!grouped[e.skill])grouped[e.skill]=[];grouped[e.skill].push({e,weight:e.type==='causal_support'?.5:1})});Object.entries(grouped).forEach(([skill,records])=>{let rating=c.skills[skill]||0;if(rating<=0||rating>=20)return;let resistance=rating>=18?8:rating>=15?6:rating>=10?4:3,total=records.reduce((s,x)=>s+x.weight,0);if(total<resistance)return;let used=[],points=0;for(let r of records){used.push(r);points+=r.weight;if(points>=resistance)break}let old=rating,advId=`adv-${c.id}-${skill.replaceAll(' ','-').toLowerCase()}-${S.year}-${S.day}-${c.advancements.length+1}`,evidenceRefs=used.map(x=>x.e.id);used.forEach(x=>x.e.developmentConsumedBy=advId);c.skills[skill]=rating+1;let advancement={id:advId,year:S.year,day:S.day,skill,from:old,to:old+1,evidenceRefs,evidencePoints:+points.toFixed(1)};c.advancements.push(advancement);report.advancements.push({characterId:c.id,name:c.name,kind:'Skill',stat:skill,from:old,to:old+1,advancementId:advId,evidenceRefs,evidencePoints:+points.toFixed(1)})})}
function elapsed(a,b){return (b.year-a.year)*360+(b.day-a.day)} function wait(){advance(30);recordDecision('wait',{days:30});log('A month passes','Training, recovery, prospect movement, stranded-expedition survival, and Guild life continue.');replacementPressure();render()}
function topSkills(skills,n=5){return Object.entries(skills).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,n)}
function exportDiagnostic(){let payload={schema:'adventurers-guild-diagnostic-v0.7',build:BUILD,skillArchitecture:{skills:SKILLS,aptitudes:APTITUDES,untrainedValue:0,magicSchools:SCHOOL_SKILLS},exportedAt:new Date().toISOString(),initialSeed:S.initialSeed,currentSeed:S.seed,simulatedDate:{year:S.year,day:S.day,elapsedDays:S.elapsedDays},guild:{gold:S.gold,charterTier:S.charterTier,licenseCap:S.licenseCap,foundingOpen:S.foundingOpen,monthlyCommitment:monthlyCommitment(),completedExpeditions:S.completed,strandedSituations:S.strandedSituations},rival:S.rival,characters:S.roster,openCall:prospects.map(p=>({id:p.id,name:p.name,age:p.age,career:p.career,asking:{signing:p.ask,retainer:p.retainer},case:S.recruitmentCases[p.id],truth:p.truth,available:S.available.includes(p.id)})),expeditions:S.expeditions,history:S.history,decisions:S.decisionLog};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`Adventurers_Guild_${BUILD}_Diagnostic_Y${S.year}D${S.day}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function render(){document.getElementById('date').textContent=`Year ${S.year}, Day ${S.day}`;document.getElementById('gold').textContent=`${S.gold}g`;document.getElementById('active').textContent=`${S.roster.filter(c=>c.field==='active'&&!c.injuries.length).length} ready`;document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t?'on':''}" onclick="S.tab='${t}';render()">${t}</button>`).join('');document.getElementById('main').innerHTML=TABS.map(t=>`<section class="pane ${S.tab===t?'on':''}">${view(t)}</section>`).join('')}
function view(t){return t==='Guild'?guild():t==='Recruit'?recruitView():t==='Adventures'?advView():t==='Careers'?careers():t==='Chronicle'?chronicle():diagnostics()}
function guild(){if(S.foundingOpen)return `<div class="hero card"><b>Your Tier I Charter has been awarded.</b><p>The Guild does not yet have a field roster. Complete the Founding Open Call before beginning ordinary operations.</p><button class="btn" onclick="S.tab='Recruit';render()">Open Founding Call</button></div>`;return `<div class="hero card"><b>v0.23.0 RC — Founding Guild established.</b><div class="muted">${S.roster.length}/${S.licenseCap} licenses · ${S.gold}g treasury · ${monthlyCommitment()}g/month commitments · runway ${runwayBand()}</div><p>The existing v0.22.9 expedition, objective dependency, injury, stranding, development, and Chronicle runtime remains in service behind the new founding layer.</p></div>${strandedView()}<div class="grid">${S.roster.map(charCard).join('')}</div><div class="section-title">Financial Ledger <span class="pill">UNTUNED ECONOMY</span></div><article class="card"><div class="stat"><span>Treasury</span><b>${S.gold}g</b><span>Monthly commitments</span><b>${monthlyCommitment()}g</b><span>Runway</span><b>${runwayBand()}</b></div>${S.financeLedger.length?S.financeLedger.slice(0,15).map(x=>`<div class="ledger-row"><span>Y${x.year} D${x.day}</span><span>${x.text}</span><span class="${x.amount>=0?'money-pos':'money-neg'}">${x.amount>=0?'+':''}${x.amount}g</span></div>`).join(''):'<div class="muted" style="margin-top:8px">No financial transactions recorded yet.</div>'}</article><button class="btn alt" onclick="wait()">Advance 30 days</button>`}
function strandedView(){let active=S.strandedSituations.filter(x=>x.status==='active');if(!active.length)return '';return `<div class="section-title">Active field emergencies</div>${active.map(sit=>{let alive=sit.partyIds.map(id=>S.roster.find(c=>c.id===id)).filter(c=>c&&c.field!=='dead'),deploy=alive.some(c=>readinessState(c)==='ready'||readinessState(c)==='limited'),remaining=Math.max(0,sit.rescueWindowDays-sit.daysStranded);return `<article class="card"><h3>Stranded — ${sit.title}</h3><div class="muted">${sit.cause.replaceAll('_',' ')} · ${sit.daysStranded} days stranded · ${sit.suppliesRemaining.toFixed(1)} Supply-Days · threat ${sit.threat}</div><div class="notice ${remaining<=3?'bad':''}"><b>Estimated critical window:</b> ${remaining>0?`about ${remaining} days before deterioration risk sharply increases`:'window exceeded — hazard exposure is escalating; casualties are possible but not automatic'}</div><div>${alive.map(c=>`${c.name}: ${readinessState(c)}`).join(' · ')}</div>${deploy?`<button class="btn alt" onclick="attemptSelfRescue('${sit.id}')">Attempt self-rescue</button>`:''}</article>`}).join('')}`}
function charCard(c){let state=readinessState(c),status=c.field==='active'?(state==='ready'?'Field ready':state==='limited'?`Limited — ${Math.max(...c.injuries.map(i=>i.days))}d recovery`:state==='sidelined'?`Sidelined — ${Math.max(...c.injuries.map(i=>i.days))}d recovery`:'Field unavailable'):c.field==='dead'?'Dead':c.field==='incapacitated'?'Field incapacitated':c.field==='stranded'?'Stranded away from Guild':c.guild==='staff'?'Guild staff':'Retired';let tops=topSkills(c.skills,5);return `<article class="card"><h3>${c.name} <span class="pill">Age ${c.age}</span></h3><div class="muted">${c.foundingMember?'Founding Member · ':''}${status} · ${c.missions} expeditions · ${c.fieldDays||0} field days</div><div class="topskills">${tops.map(([k,v])=>`<span class="tag">${k} ${v}</span>`).join('')}</div><div class="muted" style="margin-top:7px">Supply carry capacity: ${supplyCarryCapacity(c)} Supply-Days</div><div class="muted" style="margin-top:4px">Highest Aptitudes: ${Object.entries(c.apt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${k} ${v}`).join(' · ')}</div>${c.injuries.map(i=>`<div class="notice bad ${i.severity==='career-ending'?'career-consequence':''}">${i.severity==='career-ending'?'<b>FIELD CAREER ENDED</b> · ':''}${i.name} · ${i.permanent||i.recoveryExpected===false?'No recovery expected':i.days+' days remaining'}${i.episodes?.length>1?` · ${i.episodes.length} injury episodes`:''}</div>`).join('')}</article>`}

function advView(){if(S.foundingOpen)return `<div class="empty">Establish the Guild through the Founding Open Call before accepting Adventures.</div>`;let active=S.roster.filter(c=>c.field==='active'),selected=active.filter(c=>S.selectedParty.includes(c.id)),cap=selected.reduce((s,c)=>s+supplyCarryCapacity(c),0),range=selected.length?Math.floor(cap/selected.length):0,rescues=S.strandedSituations.filter(x=>x.status==='active');return (rescues.length?`<div class="section-title">Urgent rescue opportunities</div>${rescues.map(x=>`<article class="card choice ${S.selectedAdv===`rescue:${x.id}`?'selected':''}" onclick="S.selectedAdv='rescue:${x.id}';render()"><h3>Rescue: ${x.title} <span class="pill">URGENT</span></h3><p>${x.partyIds.map(name).join(', ')} remain in the field.</p><div class="muted">${x.distanceToSafetyDays} days from safety · ${x.suppliesRemaining.toFixed(1)} Supply-Days · critical window ${Math.max(0,x.rescueWindowDays-x.daysStranded)}d remaining</div>${x.distanceToSafetyDays>Math.max(0,x.rescueWindowDays-x.daysStranded)?`<div class="notice bad"><b>Timing warning:</b> estimated travel time (${x.distanceToSafetyDays}d) exceeds the current critical window. The party may deteriorate before rescuers arrive.</div>`:`<div class="notice good"><b>Timing:</b> estimated travel time fits within the current critical window.</div>`}</article>`).join('')}`:'')+adventures.map(a=>`<article class="card choice ${S.selectedAdv===a.id?'selected':''}" onclick="S.selectedAdv='${a.id}';render()"><h3>${a.title} <span class="pill">${a.risk}</span></h3><p>${a.desc}</p><div class="muted">Objective: ${a.objective}</div><div class="muted">Expected duration: roughly ${a.travel[0]*2+a.site[0]}–${a.travel[1]*2+a.site[1]} days before setbacks · ${a.need}</div></article>`).join('')+`<div class="section-title">Choose party</div>${active.map(c=>`<button class="btn ${S.selectedParty.includes(c.id)?'':'alt'}" ${c.injuries.length?'disabled':''} onclick="event.stopPropagation();toggleParty('${c. function careers(){return S.roster.map(c=>`<article class="card"><h3>${c.name}</h3><div class="muted"><b>Background:</b> ${c.background||'Unknown'} · ${c.foundingMember?'Founding Member · ':''}${c.field} / ${c.guild} · ${c.fieldDays||0} field days</div><div class="section-title">Learned Skills</div><div class="skills">${SKILLS.map(k=>`<div><span>${k}</span><b>${c.skills[k]===0?'Untrained':c.skills[k]}</b></div>`).join('')}</div><div class="section-title">Aptitudes</div><div class="skills">${APTITUDES.map(k=>`<div><span>${k}</span><b>${c.apt[k]}</b></div>`).join('')}</div><div class="section-title">Advancement</div>${c.advancements.length?c.advancements.slice(-8).map(a=>`<div class="notice good">${a.skill} <span class="delta">${a.from} → ${a.to}</span> · Y${a.year} D${a.day} · ${a.evidenceRefs?.length||0} evidence records</div>`).join(''):'<div class="muted">No permanent rating advancement yet.</div>'}<div class="section-title">Current development evidence</div>${c.evidence.slice(-12).map(e=>`<div class="notice">${e.type}${e.skill?' — '+e.skill:''}${e.aptitude?' — '+e.aptitude:''}${e.developmentConsumedBy?' · used in advancement':''}</div>`).join('')||'<div class="muted">No career evidence yet.</div>'}</article>`).join('')}

function reportView(r){let ps=r.pressure||{},sp=r.supplies||{};return `<article class="card report"><h2>${r.title} — Objective ${r.objectiveOutcome||r.outcome}</h2><div class="muted">Expedition status: <b>${r.expeditionStatus||'Returned'}</b> · ${r.durationDays} days · ${r.events.length} challenge attempts · reward ${r.reward}g</div>${r.financialResult?`<div class="notice"><b>Financial Result</b><br>Commission: +${r.financialResult.commission}g · Treasury change during expedition: <b class="${r.financialResult.netChange>=0?'good':'bad'}">${r.financialResult.netChange>=0?'+':''}${r.financialResult.netChange}g</b><br><span class="muted">Includes monthly Guild commitments that fell due while away. Economy values remain untuned.</span></div>`:''}<p><b>Objective:</b> ${r.objective}</p><div class="section-title">Objective state</div>${r.requirements.map(q=>`<div class="req"><span>${q.label}${q.criticality?` <span class="tag">${q.criticality}</span>`:''}</span><b class="${q.status==='complete'?'good':'bad'}">${q.status}</b></div>${q.reason?`<div class="muted">${q.reason}</div>`:''}`).join('')}${r.actualSituation?`<div class="notice"><b>Actual situation revealed:</b> ${r.actualSituation.summary}</div>`:''}<div class="notice"><b>Terminal reason at expedition resolution:</b> ${r.terminalReason}</div>${r.postResolution?`<div class="notice good"><b>Later field resolution:</b> ${r.postResolution.reason} (Year ${r.postResolution.year}, Day ${r.postResolution.day})</div>`:''}<div class="notice"><b>Expedition Supplies:</b> ${sp.remaining??ps.suppliesRemaining??0} / ${sp.startCapacity??ps.supplyCapacity??0} Supply-Days remaining · ${sp.state||ps.supplyState||'—'} · ${sp.requiredToSafety??ps.requiredToSafety??0} projected to reach safety${(sp.reserveTarget??ps.reserveTarget)!=null?` · reserve target ${sp.reserveTarget??ps.reserveTarget}`:''}${sp.gained?` · ${sp.gained} gained by resupply`:''}${ps.logisticsLeadId?` · Logistics: ${name(ps.logisticsLeadId)} ${ps.logisticsRating} (${ps.l
