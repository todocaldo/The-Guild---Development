if(outcome!=='progress'){let chance={progress_with_cost:.18,setback:.34,blocked:.52}[outcome]*({Moderate:.7,High:1,Severe:1.2}[risk]);if(rng()<chance){let exposed=[actor,...(support?.actor?[support.actor]:[])],target=exposed[ri(0,exposed.length-1)],severity=rng()<.10&&risk==='Severe'?'career-ending':rng()<.34?'serious':'moderate';if(severity==='career-ending'){target.field='incapacitated';ev.consequences.push({type:'injury',severity,targetId:target.id,text:`${target.name} suffered a career-ending injury during ${ch.title}.`,sourceEventId:ev.id})}else{let recovery=severity==='serious'?ri(45,100):ri(18,45),inj={id:`inj-${S.completed+1}-${target.id}-${S.lastEvent}`,name:severity==='serious'?'serious field injury':'field injury',severity,days:recovery,sourceEventId:ev.id};target.injuries.push(inj);ev.consequences.push({type:'injury',severity,recoveryDays:recovery,targetId:target.id,text:`${target.name} was injured during ${ch.title} (${recovery} days estimated recovery).`,sourceEventId:ev.id})}}}
advance(days);return ev}
function resolveStateChallenge(phase,key,party,risk,events,maxAttempts=4){let closed=[],attempts=0;while(attempts<maxAttempts){attempts++;let ev=resolveAttempt(phase,key,party,risk,closed);if(ev.terminal)return {complete:false,reason:ev.reason};events.push(ev);if(ev.outcome==='progress'||ev.outcome==='progress_with_cost'){ev.stateEffect='Requirement completed.';return {complete:true}}if(ev.outcome==='blocked'){closed.push(ev.approachId);let remaining=CH[key].approaches.filter(a=>!a.disabled&&!closed.includes(a.id)&&party.some(c=>approachCapability(c,a)>-900)).length;ev.stateEffect=remaining?`Approach closed. ${remaining} alternate approach${remaining===1?' remains':'es remain'} available.`:'Approach closed. No viable alternate approach remains.';if(!remaining)return {complete:false,reason:'All viable approaches were blocked'}}else{ev.stateEffect='No progress. The requirement remains unresolved and the party must attempt another approach or try again.'}}
return {complete:false,reason:'Repeated setbacks forced the expedition to abandon this requirement.'}}
function pick(arr){return arr[ri(0,arr.length-1)]}
function runAdventure(){let a=adventures.find(x=>x.id===S.selectedAdv),party=S.roster.filter(c=>S.selectedParty.includes(c.id)&&c.field==='active'&&!c.injuries.length);if(!a||!party.length)return;let start={year:S.year,day:S.day},events=[],requirements=[];recordDecision('commit_expedition',{opportunityId:a.id,partyIds:party.map(c=>c.id)});
let outboundTravel=ri(...a.travel);advance(Math.max(2,Math.floor(outboundTravel*.55)));let outKey=pick(OUTBOUND),outReq={id:'outbound',label:'Reach the expedition site',status:'incomplete'};requirements.push(outReq);let out=resolveStateChallenge('Outbound',outKey,party,a.risk,events,4);outReq.status=out.complete?'complete':'failed';outReq.reason=out.reason||'';if(!out.complete)return finalize(a,party,start,events,requirements,'Withdrawal','The party could not reach the expedition site and withdrew.');advance(Math.max(2,outboundTravel-Math.floor(outboundTravel*.55)));
for(let [id,label,pool] of a.stages){let req={id,label,status:'incomplete'};requirements.push(req);advance(Math.max(1,Math.floor(ri(...a.site)/a.stages.length/2)));let result=resolveStateChallenge('On-site',pick(pool),party,a.risk,events,4);req.status=result.complete?'complete':'failed';req.reason=result.reason||'';if(!result.complete){let prior=requirements.filter(r=>r.status==='complete'&&r.id!=='outbound').length;let outcome=prior?'Partial Success':'Withdrawal';return finalize(a,party,start,events,requirements,outcome,`${label} could not be completed: ${result.reason}.`)}}
let retReq={id:'return',label:a.returnRequirement,status:'incomplete'};requirements.push(retReq);let returnTravel=ri(...a.travel);advance(Math.max(2,Math.floor(returnTravel*.45)));let ret=resolveStateChallenge('Return',pick(RETURN),party,a.risk,events,4);retReq.status=ret.complete?'complete':'failed';retReq.reason=ret.reason||'';if(!ret.complete)return finalize(a,party,start,events,requirements,'Partial Success',`The expedition achieved its on-site objective but could not complete the required return: ${ret.reason}.`);advance(Math.max(2,returnTravel-Math.floor(returnTravel*.45)));return finalize(a,party,start,events,requirements,'Success','All required objective states were completed and the expedition returned.')}
function finalize(a,party,start,events,requirements,outcome,terminalReason){let reward=outcome==='Success'?55:outcome==='Partial Success'?30:8;S.gold+=reward;let duration=elapsed(start,{year:S.year,day:S.day});party.forEach(c=>{c.missions++;c.fieldDays+=duration});let report={id:`exp-${S.completed+1}`,title:a.title,objective:a.objective,risk:a.risk,start,end:{year:S.year,day:S.day},durationDays:duration,partyIds:party.map(c=>c.id),events,requirements,outcome,reward,terminalReason,advancements:[],injuries:events.flatMap(e=>e.consequences)};party.forEach(c=>develop(c,report));S.expeditions.push(report);S.lastReport=report;S.completed++;log(`${a.title}: ${outcome}`,`${duration}-day expedition. ${events.length} challenge attempts. ${terminalReason}`,party.map(c=>c.id),{expeditionId:report.id});S.selectedParty=[];S.selectedAdv=null;replacementPressure();S.tab='Chronicle';render();return report}
function develop(c,report){let by={};c.evidence.forEach(e=>{if(e.type==='skill_exercised'&&e.skill)by[e.skill]=(by[e.skill]||0)+1;if(e.type==='causal_support'&&e.skill)by[e.skill]=(by[e.skill]||0)+.5});Object.keys(by).forEach(skill=>{let rating=c.skills[skill]||0;if(rating<=0)return;let resistance=rating>=18?8:rating>=15?6:rating>=10?4:3;if(by[skill]>=resistance&&rating<20){let old=rating;c.skills[skill]=rating+1;c.advancements.push({year:S.year,day:S.day,skill,from:old,to:old+1});c.evidence=c.evidence.filter(e=>e.skill!==skill);report.advancements.push({characterId:c.id,name:c.name,kind:'Skill',stat:skill,from:old,to:old+1})}})}
function elapsed(a,b){return (b.year-a.year)*360+(b.day-a.day)} function wait(){advance(30);recordDecision('wait',{days:30});log('A month passes','Training, recovery, prospect movement, and Guild life continue.');render()}
function topSkills(skills,n=5){return Object.entries(skills).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,n)}
function exportDiagnostic(){let payload={schema:'adventurers-guild-diagnostic-v0.2',build:BUILD,skillArchitecture:{skills:SKILLS,aptitudes:APTITUDES,untrainedValue:0,magicSchools:SCHOOL_SKILLS},exportedAt:new Date().toISOString(),initialSeed:S.initialSeed,currentSeed:S.seed,simulatedDate:{year:S.year,day:S.day},guild:{gold:S.gold,completedExpeditions:S.completed},characters:S.roster,prospects:prospects.map(p=>({id:p.id,name:p.name,known:p.known,truth:p.truth,available:S.available.includes(p.id)})),expeditions:S.expeditions,history:S.history,decisions:S.decisionLog};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`Adventurers_Guild_${BUILD}_Diagnostic_Y${S.year}D${S.day}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function render(){document.getElementById('date').textContent=`Year ${S.year}, Day ${S.day}`;document.getElementById('gold').textContent=`${S.gold}g`;document.getElementById('active').textContent=`${S.roster.filter(c=>c.field==='active'&&!c.injuries.length).length} ready`;document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t?'on':''}" onclick="S.tab='${t}';render()">${t}</button>`).join('');document.getElementById('main').innerHTML=TABS.map(t=>`<section class="pane ${S.tab===t?'on':''}">${view(t)}</section>`).join('')}
function view(t){return t==='Guild'?guild():t==='Recruit'?recruitView():t==='Adventures'?advView():t==='Careers'?careers():t==='Chronicle'?chronicle():diagnostics()}
function guild(){return `<div class="hero card"><b>v0.22.1 correction:</b> every adventurer now has the complete Aptitude and Learned Skill profile. Challenges offer context-specific approaches, blocked approaches close and force alternatives, and support participation is recorded causally.</div><div class="grid">${S.roster.map(charCard).join('')}</div><button class="btn alt" onclick="wait()">Advance 30 days</button>`}
function charCard(c){let status=c.field==='active'?(c.injuries.length?`Recovering — ${Math.max(...c.injuries.map(i=>i.days))}d`:'Field ready'):c.field==='dead'?'Dead':c.field==='incapacitated'?'Field incapacitated':c.guild==='staff'?'Guild staff':'Retired';let tops=topSkills(c.skills,5);return `<article class="card"><h3>${c.name} <span class="pill">Age ${c.age}</span></h3><div class="muted">${status} · ${c.missions} expeditions · ${c.fieldDays||0} field days</div><div class="topskills">${tops.map(([k,v])=>`<span class="tag">${k} ${v}</span>`).join('')}</div><div class="muted" style="margin-top:7px">Highest Aptitudes: ${Object.entries(c.apt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${k} ${v}`).join(' · ')}</div>${c.injuries.map(i=>`<div class="notice bad">${i.name} · ${i.days} days remaining</div>`).join('')}</article>`}
function recruitView(){let avail=prospects.filter(p=>S.available.includes(p.id));return avail.length?avail.map(p=>`<article class="card"><h3>${p.name} <span class="pill">Age ${p.age}</span></h3><p>${p.summary}</p>${p.known.map(k=>`<div class="notice">${k}</div>`).join('')}<div class="row"><button class="btn alt" onclick="evalProspect('${p.id}','Interview')">Interview · 3d</button><button class="btn alt" onclick="evalProspect('${p.id}','References')">References · 3d</button><button class="btn alt" onclick="evalProspect('${p.id}','Demonstration')">Demonstration · 5d</button><button class="btn" onclick="recruit('${p.id}')">Recruit · ${p.ask}g</button></div></article>`).join(''):`<div class="empty">No current prospects.</div>`}
function advView(){let active=S.roster.filter(c=>c.field==='active');return adventures.map(a=>`<article class="card choice ${S.selectedAdv===a.id?'selected':''}" onclick="S.selectedAdv='${a.id}';render()"><h3>${a.title} <span class="pill">${a.risk}</span></h3><p>${a.desc}</p><div class="muted">Objective: ${a.objective}</div><div class="muted">Expected duration: roughly ${a.travel[0]*2+a.site[0]}–${a.travel[1]*2+a.site[1]} days before setbacks · ${a.need}</div></article>`).join('')+`<div class="section-title">Choose party</div>${active.map(c=>`<button class="btn ${S.selectedParty.includes(c.id)?'':'alt'}" ${c.injuries.length?'disabled':''} onclick="event.stopPropagation();toggleParty('${c.id}')">${c.name}${c.injuries.length?' (recovering)':''}</button> `).join('')}<div style="margin-top:12px"><button class="btn" ${!S.selectedAdv||!S.selectedParty.length?'disabled':''} onclick="runAdventure()">Commit expedition</button></div>`}
function careers(){return S.roster.map(c=>`<article class="card"><h3>${c.name}</h3><div class="muted">${c.field} / ${c.guild} · ${c.fieldDays||0} field days</div><div class="section-title">Learned Skills</div><div class="skills">${SKILLS.map(k=>`<div><span>${k}</span><b>${c.skills[k]===0?'Untrained':c.skills[k]}</b></div>`).join('')}</div><div class="section-title">Aptitudes</div><div class="skills">${APTITUDES.map(k=>`<div><span>${k}</span><b>${c.apt[k]}</b></div>`).join('')}</div><div class="section-title">Advancement</div>${c.advancements.length?c.advancements.slice(-8).map(a=>`<div class="notice good">${a.skill} <span class="delta">${a.from} → ${a.to}</span> · Y${a.year} D${a.day}</div>`).join(''):'<div class="muted">No permanent rating advancement yet.</div>'}<div class="section-title">Current development evidence</div>${c.evidence.slice(-10).map(e=>`<div class="notice">${e.type}${e.skill?' — '+e.skill:''}${e.aptitude?' — '+e.aptitude:''}</div>`).join('')||'<div class="muted">No unresolved evidence.</div>'}</article>`).join('')}
function prettyOutcome(x){return x.replaceAll('_',' ')} function name(id){return S.roster.find(c=>c.id===id)?.name||id}
function reportView(r){return `<article class="card report"><h2>${r.title} — ${r.outcome}</h2><div class="muted">${r.durationDays} days · ${r.events.length} challenge attempts · reward ${r.reward}g</div><p><b>Objective:</b> ${r.objective}</p><div class="section-title">Objective state</div>${r.requirements.map(q=>`<div class="req"><span>${q.label}</span><b class="${q.status==='complete'?'good':'bad'}">${q.status}</b></div>${q.reason?`<div class="muted">${q.reason}</div>`:''}`).join('')}<div class="notice"><b>Terminal reason:</b> ${r.terminalReason}</div>${r.events.map(e=>`<div class="card challenge"><div class="phase">${e.phase}</div><b>${e.title}</b> — ${prettyOutcome(e.outcome)}<div class="muted">${name(e.actorId)} · ${e.approachLabel} · ${e.skill} + ${e.apts.join(' + ')} · d20 ${e.roll} + capability ${e.capability}${e.supportBonus?` + support ${e.supportBonus}`:''} vs TN ${e.tn} · margin ${e.margin>=0?'+':''}${e.margin} · ${e.days}d</div>${e.supporterId?`<div class="support">Causal support: ${name(e.supporterId)}</div>`:''}${e.stateEffect?`<div class="closed">${e.stateEffect}</div>`:''}${e.consequences.map(x=>`<div class="notice bad">${x.text}</div>`).join('')}</div>`).join('')}<div class="section-title">Career impact</div>${r.advancements.length?r.advancements.map(a=>`<div class="notice good">${a.name}: ${a.stat} <b>${a.from} → ${a.to}</b></div>`).join(''):'<div class="notice">No permanent rating increased. Development evidence was still recorded for primary actors and causal supporters.</div>'}</article>`}
function chronicle(){return (S.lastReport?reportView(S.lastReport):'')+(S.history.length?`<div class="section-title">Guild chronicle</div><div class="timeline">${S.history.map(e=>`<div class="event"><b>Y${e.year} D${e.day} — ${e.title}</b><div>${e.text}</div></div>`).join('')}</div>`:'<div class="empty">The Guild has not made history yet.</div>')}
function diagnostics(){return `<article class="card"><h2>Playtest diagnostics</h2><p>Export the complete deterministic run for review. v0.22.1 includes all 24 Learned Skills, all eight Aptitudes, untrained states, chosen approaches, alternate-approach closures, primary actors, causal supporters, objective-state transitions, rolls, injuries, evidence, advancements, and Guild state.</p><button class="btn" onclick="exportDiagnostic()">Export Diagnostic JSON</button><div class="notice">Developer diagnostic data intentionally includes information hidden from the normal recruitment interface.</div></article>`}
render();
</script></body></html>
