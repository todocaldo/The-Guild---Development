<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adventurers Guild — Procedural Expedition Runtime v0.2</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#20231f;background:#eee9dc}*{box-sizing:border-box}body{margin:0}.app{max-width:920px;margin:auto;min-height:100vh;background:#f8f4e9}.top{position:sticky;top:0;z-index:5;background:#26352d;color:white;padding:12px 14px;box-shadow:0 2px 8px #0003}.top h1{font-size:18px;margin:0}.meta,.row{display:flex;gap:8px;flex-wrap:wrap}.meta{font-size:12px;opacity:.9;margin-top:5px}.nav{display:flex;overflow:auto;background:#ddd4c0;border-bottom:1px solid #c7bda8}.nav button{border:0;background:none;padding:11px 14px;white-space:nowrap}.nav button.on{background:#f8f4e9;font-weight:700;border-bottom:3px solid #72552d}.pane{display:none;padding:14px}.pane.on{display:block}.card{background:white;border:1px solid #d5cdbd;border-radius:12px;padding:13px;margin:0 0 12px;box-shadow:0 1px 3px #0001}.card h2,.card h3{margin:0 0 7px}.pill{font-size:11px;padding:3px 7px;border-radius:20px;background:#ece7dc}.muted{color:#6e706b;font-size:12px}.stat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;margin-top:8px}.btn{border:0;border-radius:8px;padding:9px 11px;background:#385746;color:white;font-weight:650}.btn.alt{background:#7a694d}.btn:disabled{opacity:.4}.notice{padding:10px;border-left:4px solid #876d3d;background:#f3ead6;margin:8px 0;font-size:13px}.timeline{border-left:2px solid #c4b89f;margin-left:7px;padding-left:13px}.event{margin:0 0 12px}.event b{font-size:13px}.event div{font-size:12px;color:#555}.good{color:#315f40}.bad{color:#8a3932}.hero{font-size:14px;line-height:1.45}.empty{text-align:center;color:#777;padding:30px 10px}.choice{border:2px solid transparent}.choice.selected{border-color:#72552d}.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#706b61;margin:14px 0 7px}.challenge{border-left:4px solid #9b8b6a}.phase{font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.08em;color:#72552d}.delta{font-weight:800}.report{background:#fbfaf5}@media(min-width:700px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.pane{padding:20px}}
</style></head><body><div class="app"><header class="top"><h1>Adventurers’ Guild — Procedural Expedition Runtime</h1><div class="meta"><span id="date"></span><span id="gold"></span><span id="active"></span><span>v0.22</span></div></header><nav class="nav" id="nav"></nav><main id="main"></main></div><script>
const BUILD='v0.22'; const TABS=['Guild','Recruit','Adventures','Careers','Chronicle','Diagnostics'];
const prospects=[
{id:'mara',name:'Mara Venn',age:19,ask:45,summary:'Caravan outrider with strong references and an uncertain ceiling.',known:['Awareness: promising','Mobility: promising','Melee: limited evidence'],truth:{awareness:14,mobility:13,melee:7,resilience:11,potential:'strong'}},
{id:'elian',name:'Elian Tor',age:22,ask:55,summary:'Apothecary assistant fascinated by old wards. Another guild has made contact.',known:['Intelligence: strong evidence','Focus: promising','Warding: uncertain'],truth:{awareness:10,mobility:9,melee:5,resilience:10,potential:'exceptional'}},
{id:'tessa',name:'Tessa Arlen',age:20,ask:38,summary:'Local hunter. Reliable references; little experience beyond the district.',known:['Awareness: adequate','Mobility: adequate','Melee: uncertain'],truth:{awareness:12,mobility:12,melee:6,resilience:13,potential:'ordinary'}},
{id:'corin',name:'Corin Vale',age:18,ask:42,summary:'A miller’s son with unusual composure who appears after the Guild suffers turnover.',known:['Resilience: promising','Strength: promising','Field skill: little evidence'],truth:{awareness:11,mobility:11,melee:5,resilience:15,potential:'strong'}}];
const adventures=[
{id:'survey',title:'Missing Survey Team',risk:'Moderate',travel:[7,12],site:[9,16],need:'Tracking, awareness, endurance',desc:'A Crownfields survey party vanished beyond the old boundary stones.',objective:'Find the missing surveyors and return survivors to safety.'},
{id:'bell',title:'The Bell Below Dunmere',risk:'High',travel:[10,16],site:[12,20],need:'Focus, arcane reasoning, composure',desc:'A submerged bell is sounding beneath an abandoned chapel.',objective:'Discover why the bell is sounding and end the immediate danger.'},
{id:'whitehorn',title:'The Whitehorn Problem',risk:'High',travel:[8,14],site:[12,19],need:'Awareness, mobility, creature handling',desc:'Something is driving whitehorns down from the ridge into farms.',objective:'Identify the cause and stop the attacks on the farms.'},
{id:'road',title:'Road of Glass',risk:'Severe',travel:[14,22],site:[12,22],need:'Leadership, resilience, arcane awareness',desc:'Escort a scholar through a route warped by recurring arcane weather.',objective:'Get the scholar through the Glass Road and return with the expedition record.'}];
const travelChallenges=[['Flooded Crossing','Tracking','Awareness','The route is cut by fast water and unstable banks.'],['Night Predators','Melee','Awareness','Predators circle the camp after dark.'],['Broken Trail','Tracking','Mobility','A landslide has erased the known trail.'],['Arcane Weather','Melee','Resilience','A violent arcane squall sweeps across the route.'],['Hostile Wayfarers','Melee','Resilience','Armed strangers contest passage through the road.']];
const siteChallenges={survey:[['Read the abandoned camp','Tracking','Awareness'],['Follow the lost trail','Tracking','Mobility'],['Extract the survivors','Melee','Resilience']],bell:[['Enter the drowned chapel','Tracking','Mobility'],['Interpret the ward pattern','Tracking','Awareness'],['Silence the bell chamber','Melee','Resilience']],whitehorn:[['Track the herd','Tracking','Awareness'],['Discover the disturbance','Tracking','Awareness'],['Confront the source','Melee','Mobility']],road:[['Read the Glass Road','Tracking','Awareness'],['Cross the warped reach','Melee','Resilience'],['Protect the scholar','Melee','Mobility']]};
let S={tab:'Guild',day:1,year:1,gold:180,roster:[mkVeteran()],available:['mara','elian','tessa'],selectedAdv:null,selectedParty:[],history:[],expeditions:[],lastReport:null,completed:0,initialSeed:9173,seed:9173,decisionLog:[]};
function mkVeteran(){return {id:'orin',name:'Orin Hale',age:34,field:'active',guild:'member',skills:{Melee:15,Tracking:13,Leadership:12},apt:{Awareness:14,Mobility:13,Resilience:14},injuries:[],evidence:[],missions:31,fieldDays:620,years:14,mentor:true,advancements:[]}}
function rng(){S.seed=(S.seed*1664525+1013904223)>>>0;return S.seed/4294967296} function ri(a,b){return a+Math.floor(rng()*(b-a+1))}
function log(title,text,who=[],detail={}){S.history.unshift({day:S.day,year:S.year,title,text,who,...detail})}
function recordDecision(type,data){S.decisionLog.push({year:S.year,day:S.day,type,...data})}
function advance(days){for(let i=0;i<days;i++){S.day++;S.roster.forEach(c=>c.injuries.forEach(x=>x.days=Math.max(0,x.days-1)));if(S.day>360){S.day=1;S.year++;S.roster.forEach(c=>{c.age++;c.years++});careerChecks()}};S.roster.forEach(c=>{let healed=c.injuries.filter(x=>x.days===0);healed.forEach(i=>log('Recovery',`${c.name} returned to field readiness after ${i.name}.`,[c.id],{injuryId:i.id}));c.injuries=c.injuries.filter(x=>x.days>0)})}
function careerChecks(){S.roster.forEach(c=>{if(c.field!=='active')return;if(c.years>=22&&rng()<.035){c.field='retired';c.guild='staff';log('Career transition',`${c.name} ended field service and remained with the Guild as a veteran trainer.`,[c.id])}else if(c.years>=16&&rng()<.018){c.field='retired';c.guild='departed';log('Retirement',`${c.name} retired from adventuring and left the Guild on good terms.`,[c.id])}});replacementPressure()}
function replacementPressure(){if(S.roster.filter(c=>c.field==='active'&&!c.injuries.length).length<2&&!S.available.includes('corin')&&!S.roster.some(c=>c.id==='corin')){S.available.push('corin');log('Recruitment pressure','Reduced field depth has brought a new prospect to the Guild’s attention.')}}
function recruit(id){let p=prospects.find(x=>x.id===id);if(!p||S.gold<p.ask)return;S.gold-=p.ask;S.available=S.available.filter(x=>x!==id);let c={id:p.id,name:p.name,age:p.age,field:'active',guild:'member',skills:{Melee:p.truth.melee,Tracking:Math.max(4,p.truth.awareness-5),Leadership:4},apt:{Awareness:p.truth.awareness,Mobility:p.truth.mobility,Resilience:p.truth.resilience},potential:p.truth.potential,injuries:[],evidence:[],missions:0,fieldDays:0,years:0,advancements:[]};S.roster.push(c);recordDecision('recruit',{characterId:id,cost:p.ask});log('Recruited',`${p.name} joined for ${p.ask} gold. Their ceiling remains uncertain.`,[id]);S.tab='Guild';render()}
function evalProspect(id,type){let p=prospects.find(x=>x.id===id),cost=type==='Demonstration'?5:3;advance(cost);let reveal=type==='Interview'?`Temperament appears steady; ${p.truth.resilience>=13?'handles pressure unusually well':'no exceptional pressure response observed'}.`:type==='References'?`References support Awareness around ${band(p.truth.awareness)} and describe ${p.truth.potential==='exceptional'?'unusually rapid learning':'a credible developmental path'}.`:`A practical exercise suggests ${band(p.truth.melee)} current combat training; movement looks ${band(p.truth.mobility)}.`;if(!p.known.includes(reveal))p.known.push(reveal);recordDecision('evaluate',{characterId:id,method:type,days:cost});log('Prospect evaluation',`${type}: ${p.name} — ${reveal}`,[id]);render()}
function band(v){return v>=15?'exceptional':v>=13?'strong':v>=11?'adequate':'limited'} function toggleParty(id){S.selectedParty=S.selectedParty.includes(id)?S.selectedParty.filter(x=>x!==id):[...S.selectedParty,id];render()}
function cap(c,skill,apt){return Math.round((c.skills[skill]||4)*.55+(c.apt[apt]||10)*.45)}
function challenge(phase,title,skill,apt,party,risk,summary){let actor=[...party].sort((a,b)=>cap(b,skill,apt)-cap(a,skill,apt))[0],base={Moderate:19,High:22,Severe:25}[risk],tn=base+(phase==='Return'&&party.some(c=>c.injuries.length)?1:0),roll=ri(1,20),capability=cap(actor,skill,apt),margin=roll+capability-tn,outcome=margin>=5?'progress':margin>=0?'progress_with_cost':margin>=-5?'setback':'blocked',days=ri(2,5),ev={id:`ev-${S.completed+1}-${S.lastEvent=(S.lastEvent||0)+1}`,phase,title,summary,actorId:actor.id,skill,apt,roll,capability,tn,margin,outcome,days,consequences:[]};actor.evidence.push({year:S.year,day:S.day,type:'skill_exercised',skill,sourceEventId:ev.id,stretch:risk!=='Moderate'});actor.evidence.push({year:S.year,day:S.day,type:'aptitude_demonstrated',aptitude:apt,sourceEventId:ev.id});if(outcome==='progress')actor.evidence.push({year:S.year,day:S.day,type:'decisive_contribution',sourceEventId:ev.id});if(outcome==='setback'||outcome==='blocked')actor.evidence.push({year:S.year,day:S.day,type:'adverse_experience',sourceEventId:ev.id});if(outcome!=='progress'){let chance={progress_with_cost:.22,setback:.42,blocked:.62}[outcome]*({Moderate:.7,High:1,Severe:1.25}[risk]);if(rng()<chance){let target=party[ri(0,party.length-1)],severity=rng()<.12&&risk==='Severe'?'career-ending':rng()<.38?'serious':'moderate';if(severity==='career-ending'){target.field='incapacitated';target.guild='member';ev.consequences.push({type:'injury',severity,targetId:target.id,text:`${target.name} suffered a career-ending injury during ${title}.`})}else{let recovery=severity==='serious'?ri(45,100):ri(18,45),inj={id:`inj-${S.completed+1}-${target.id}-${S.lastEvent}`,name:severity==='serious'?'serious field injury':'field injury',severity,days:recovery,sourceEventId:ev.id};target.injuries.push(inj);ev.consequences.push({type:'injury',severity,recoveryDays:recovery,targetId:target.id,text:`${target.name} was injured during ${title} (${recovery} days estimated recovery).`})}}}advance(days);return ev}
function develop(c,report){let by={};c.evidence.forEach(e=>{if(e.type==='skill_exercised')by[e.skill]=(by[e.skill]||0)+1});Object.keys(by).forEach(skill=>{let rating=c.skills[skill]||4,resistance=rating>=18?8:rating>=15?6:4;if(by[skill]>=resistance&&rating<20){let old=rating;c.skills[skill]=rating+1;c.advancements.push({year:S.year,day:S.day,skill,from:old,to:old+1});c.evidence=c.evidence.filter(e=>e.skill!==skill);report.advancements.push({characterId:c.id,name:c.name,kind:'Skill',stat:skill,from:old,to:old+1})}})}
function runAdventure(){let a=adventures.find(x=>x.id===S.selectedAdv),party=S.roster.filter(c=>S.selectedParty.includes(c.id)&&c.field==='active'&&!c.injuries.length);if(!a||!party.length)return;let start={year:S.year,day:S.day},events=[],outDays=ri(...a.travel),siteDays=ri(...a.site),returnDays=ri(...a.travel);recordDecision('commit_expedition',{opportunityId:a.id,partyIds:party.map(c=>c.id)});advance(Math.max(2,outDays-4));events.push(challenge('Outbound',travelChallenges[ri(0,travelChallenges.length-1)][0],travelChallenges[ri(0,travelChallenges.length-1)][1]||'Tracking','Awareness',party,a.risk,'Travel through dangerous country tests the expedition.'));let sc=siteChallenges[a.id];for(let x of sc){advance(Math.max(1,Math.floor(siteDays/sc.length)-3));events.push(challenge('On-site',x[0],x[1],x[2],party,a.risk,`The party works toward: ${a.objective}`))}advance(Math.max(2,returnDays-4));let tc=travelChallenges[ri(0,travelChallenges.length-1)];events.push(challenge('Return',tc[0],tc[1],tc[2],party,a.risk,'The return journey remains dangerous even after the objective work is done.'));let progress=events.filter(e=>e.phase==='On-site'&&(e.outcome==='progress'||e.outcome==='progress_with_cost')).length,blocked=events.filter(e=>e.outcome==='blocked').length,objective=progress>=2,outcome=objective?(blocked?'Partial Success':'Success'):(progress?'Partial Success':'Withdrawal'),reward=outcome==='Success'?55:outcome==='Partial Success'?35:8;S.gold+=reward;party.forEach(c=>{c.missions++;c.fieldDays+=elapsed(start,{year:S.year,day:S.day})});let report={id:`exp-${S.completed+1}`,title:a.title,objective:a.objective,risk:a.risk,start,end:{year:S.year,day:S.day},durationDays:elapsed(start,{year:S.year,day:S.day}),partyIds:party.map(c=>c.id),events,outcome,reward,advancements:[],injuries:events.flatMap(e=>e.consequences)};party.forEach(c=>develop(c,report));S.expeditions.push(report);S.lastReport=report;S.completed++;log(`${a.title}: ${outcome}`,`${report.durationDays}-day expedition. ${events.length} challenges resolved across outbound travel, on-site operations, and return. ${report.injuries.length?report.injuries.map(x=>x.text).join(' '):'The party returned without a lasting injury.'}`,party.map(c=>c.id),{expeditionId:report.id});S.selectedParty=[];S.selectedAdv=null;replacementPressure();S.tab='Chronicle';render()}
function elapsed(a,b){return (b.year-a.year)*360+(b.day-a.day)} function wait(){advance(30);recordDecision('wait',{days:30});log('A month passes','Training, recovery, prospect movement, and Guild life continue.');render()}
function exportDiagnostic(){let payload={schema:'adventurers-guild-diagnostic-v0.1',build:BUILD,exportedAt:new Date().toISOString(),initialSeed:S.initialSeed,currentSeed:S.seed,simulatedDate:{year:S.year,day:S.day},guild:{gold:S.gold,completedExpeditions:S.completed},characters:S.roster,prospects:prospects.map(p=>({id:p.id,name:p.name,known:p.known,truth:p.truth,available:S.available.includes(p.id)})),expeditions:S.expeditions,history:S.history,decisions:S.decisionLog};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`Adventurers_Guild_${BUILD}_Diagnostic_Y${S.year}D${S.day}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function render(){document.getElementById('date').textContent=`Year ${S.year}, Day ${S.day}`;document.getElementById('gold').textContent=`${S.gold}g`;document.getElementById('active').textContent=`${S.roster.filter(c=>c.field==='active'&&!c.injuries.length).length} ready`;document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t?'on':''}" onclick="S.tab='${t}';render()">${t}</button>`).join('');document.getElementById('main').innerHTML=TABS.map(t=>`<section class="pane ${S.tab===t?'on':''}">${view(t)}</section>`).join('')}
function view(t){return t==='Guild'?guild():t==='Recruit'?recruitView():t==='Adventures'?advView():t==='Careers'?careers():t==='Chronicle'?chronicle():diagnostics()}
function guild(){return `<div class="hero card"><b>v0.22 test:</b> expeditions are now multi-week, multi-challenge undertakings. Travel consumes roster time and can injure adventurers before or after the objective.</div><div class="grid">${S.roster.map(charCard).join('')}</div><button class="btn alt" onclick="wait()">Advance 30 days</button>`}
function charCard(c){let status=c.field==='active'?(c.injuries.length?`Recovering — ${Math.max(...c.injuries.map(i=>i.days))}d`:'Field ready'):c.field==='dead'?'Dead':c.field==='incapacitated'?'Field incapacitated':c.guild==='staff'?'Guild staff':'Retired';return `<article class="card"><h3>${c.name} <span class="pill">Age ${c.age}</span></h3><div class="muted">${status} · ${c.missions} expeditions · ${c.fieldDays||0} field days</div><div class="stat"><span>Melee</span><b>${c.skills.Melee}</b><span>Tracking</span><b>${c.skills.Tracking}</b><span>Leadership</span><b>${c.skills.Leadership}</b><span>Awareness</span><b>${c.apt.Awareness}</b><span>Mobility</span><b>${c.apt.Mobility}</b><span>Resilience</span><b>${c.apt.Resilience}</b></div>${c.injuries.map(i=>`<div class="notice bad">${i.name} · ${i.days} days remaining</div>`).join('')}</article>`}
function recruitView(){let avail=prospects.filter(p=>S.available.includes(p.id));return avail.length?avail.map(p=>`<article class="card"><h3>${p.name} <span class="pill">Age ${p.age}</span></h3><p>${p.summary}</p>${p.known.map(k=>`<div class="notice">${k}</div>`).join('')}<div class="row"><button class="btn alt" onclick="evalProspect('${p.id}','Interview')">Interview · 3d</button><button class="btn alt" onclick="evalProspect('${p.id}','References')">References · 3d</button><button class="btn alt" onclick="evalProspect('${p.id}','Demonstration')">Demonstration · 5d</button><button class="btn" onclick="recruit('${p.id}')">Recruit · ${p.ask}g</button></div></article>`).join(''):`<div class="empty">No current prospects.</div>`}
function advView(){let active=S.roster.filter(c=>c.field==='active');return adventures.map(a=>`<article class="card choice ${S.selectedAdv===a.id?'selected':''}" onclick="S.selectedAdv='${a.id}';render()"><h3>${a.title} <span class="pill">${a.risk}</span></h3><p>${a.desc}</p><div class="muted">Objective: ${a.objective}</div><div class="muted">Expected duration: roughly ${a.travel[0]*2+a.site[0]}–${a.travel[1]*2+a.site[1]} days before complications · ${a.need}</div></article>`).join('')+`<div class="section-title">Choose party</div>${active.map(c=>`<button class="btn ${S.selectedParty.includes(c.id)?'':'alt'}" ${c.injuries.length?'disabled':''} onclick="event.stopPropagation();toggleParty('${c.id}')">${c.name}${c.injuries.length?' (recovering)':''}</button> `).join('')}<div style="margin-top:12px"><button class="btn" ${!S.selectedAdv||!S.selectedParty.length?'disabled':''} onclick="runAdventure()">Commit expedition</button></div>`}
function careers(){return S.roster.map(c=>`<article class="card"><h3>${c.name}</h3><div class="muted">${c.field} / ${c.guild} · ${c.fieldDays||0} field days</div><div class="section-title">Advancement</div>${c.advancements.length?c.advancements.slice(-6).map(a=>`<div class="notice good">${a.skill} <span class="delta">${a.from} → ${a.to}</span> · Y${a.year} D${a.day}</div>`).join(''):'<div class="muted">No permanent rating advancement yet.</div>'}<div class="section-title">Current development evidence</div>${c.evidence.slice(-8).map(e=>`<div class="notice">${e.type}${e.skill?' — '+e.skill:''}${e.aptitude?' — '+e.aptitude:''}</div>`).join('')||'<div class="muted">No unresolved evidence.</div>'}</article>`).join('')}
function reportView(r){return `<article class="card report"><h2>${r.title} — ${r.outcome}</h2><div class="muted">${r.durationDays} days · ${r.events.length} challenges · reward ${r.reward}g</div><p><b>Objective:</b> ${r.objective}</p>${r.events.map(e=>`<div class="card challenge"><div class="phase">${e.phase}</div><b>${e.title}</b> — ${e.outcome}<div class="muted">${name(e.actorId)} · ${e.skill} + ${e.apt} · d20 ${e.roll} + capability ${e.capability} vs TN ${e.tn} · margin ${e.margin>=0?'+':''}${e.margin} · ${e.days}d</div>${e.consequences.map(x=>`<div class="notice bad">${x.text}</div>`).join('')}</div>`).join('')}<div class="section-title">Career impact</div>${r.advancements.length?r.advancements.map(a=>`<div class="notice good">${a.name}: ${a.stat} <b>${a.from} → ${a.to}</b></div>`).join(''):'<div class="notice">No permanent rating increased. Development evidence was still recorded from exercised skills and demonstrated aptitudes.</div>'}</article>`}
function name(id){return S.roster.find(c=>c.id===id)?.name||id}
function chronicle(){return (S.lastReport?reportView(S.lastReport):'')+(S.history.length?`<div class="section-title">Guild chronicle</div><div class="timeline">${S.history.map(e=>`<div class="event"><b>Y${e.year} D${e.day} — ${e.title}</b><div>${e.text}</div></div>`).join('')}</div>`:'<div class="empty">The Guild has not made history yet.</div>')}
function diagnostics(){return `<article class="card"><h2>Playtest diagnostics</h2><p>Export the complete deterministic run for review. The file intentionally includes hidden prospect truth, seeds, player decisions, challenge rolls, capability/TN/margins, injuries, evidence, advancements, expedition history, and Guild state.</p><button class="btn" onclick="exportDiagnostic()">Export Diagnostic JSON</button><div class="notice">Developer diagnostic data may reveal information intentionally hidden from the normal player interface.</div></article>`}
render();
</script></body></html>
